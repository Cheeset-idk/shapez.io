<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shapez.io Local Instance</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="loading-screen" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font-family:sans-serif;font-size:24px;z-index:9999;">
        Loading Game Engine...
    </div>
    <script>
        // Redirect asset calls directly to the open source CDN instance
        window.addEventListener('DOMContentLoaded', () => {
            const iframe = document.createElement('iframe');
            iframe.src = 'https://dimava.github.io/shapez/modZ/';
            iframe.style.position = 'fixed';
            iframe.style.top = '0';
            iframe.style.left = '0';
            iframe.style.width = '100%';
            iframe.style.height = '100%';
            iframe.style.border = 'none';
            iframe.onload = () => document.getElementById('loading-screen').remove();
            document.body.appendChild(iframe);
        });
    </script>
</body>
</html>
