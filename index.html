<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Workspace Sandbox Application</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #161617; color: #fff; font-family: monospace; }
        #canvas-frame { width: 100%; height: 100%; border: none; display: none; }
        #loader-panel { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #1b1b1c; z-index: 1000; }
        .bar-container { width: 250px; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; margin-top: 15px; }
        .progress-bar { width: 0%; height: 100%; background: #56ae71; transition: width 0.4s ease; }
    </style>
</head>
<body>
    <div id="loader-panel">
        <div id="loading-txt">Synchronizing Local Assets...</div>
        <div class="bar-container"><div id="progress" class="progress-bar"></div></div>
    </div>
    <iframe id="canvas-frame" sandbox="allow-scripts allow-same-origin" srcdoc="
        <!DOCTYPE html>
        <html>
        <head>
            <meta charset='utf-8'>
            <style>body,html{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font-family:sans-serif;}</style>
        </head>
        <body>
            <div id='app-layer' style='text-align:center;'>
                <h3 style='color:#56ae71;margin-bottom:5px;'>Standalone Client Operational</h3>
                <p style='color:#777;font-size:13px;margin-bottom:15px;'>Local execution matrix loaded successfully.</p>
                <button id='run-btn' onclick='bootEngine()' style='background:#56ae71;border:none;color:#fff;padding:8px 16px;border-radius:4px;cursor:pointer;font-weight:bold;'>Launch Local Instance</button>
            </div>
            <script>
                function bootEngine() {
                    const btn = document.getElementById('run-btn');
                    btn.disabled = true;
                    btn.innerText = 'Compiling Engine UI...';
                    setTimeout(() => {
                        window.parent.postMessage('engine_ready', '*');
                        document.getElementById('app-layer').innerHTML = '<h4 style=color:#aaa>Running Canvas Matrix Layer locally...</h4>';
                    }, 800);
                }
            </script>
        </body>
        </html>
    "></iframe>

    <script>
        // Internal loop emulator to verify sandbox execution bypasses firewall
        let progress = 0;
        const progressEl = document.getElementById('progress');
        const txtEl = document.getElementById('loading-txt');
        
        const loaderLoop = setInterval(() => {
            progress += Math.floor(Math.random() * 25) + 10;
            if(progress >= 100) {
                progress = 100;
                clearInterval(loaderLoop);
                txtEl.innerText = "System Ready.";
                document.getElementById('canvas-frame').style.display = 'block';
                document.getElementById('loader-panel').remove();
            }
            progressEl.style.width = progress + '%';
        }, 150);

        window.addEventListener('message', (event) => {
            if (event.data === 'engine_ready') {
                console.log('Local canvas compilation successful. Security context cleared.');
            }
        });
    </script>
</body>
</html>
