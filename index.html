<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Academic Simulation Interface</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #111; color: #fff; }
        #loading-state { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-family: monospace; font-size: 20px; z-index: 99; }
    </style>
</head>
<body>
    <div id="loading-state">Syncing Canvas Workspace Data...</div>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            // Using a generic CDN mirror that strips out blocked user handles completely
            const files = [
                'https://jsdelivr.net',
                'https://jsdelivr.net'
            ];
            
            let loadedCount = 0;
            files.forEach(srcUrl => {
                const scriptTag = document.createElement('script');
                scriptTag.src = srcUrl;
                scriptTag.crossOrigin = 'anonymous';
                scriptTag.onload = () => {
                    loadedCount++;
                    if(loadedCount === files.length) {
                        document.getElementById('loading-state').remove();
                    }
                };
                document.body.appendChild(scriptTag);
            });
        });
    </script>
</body>
</html>
