<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Systems Portfolio Workspace</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #111; color: #fff; }
        #canvas-loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-family: monospace; font-size: 20px; z-index: 99; }
    </style>
</head>
<body>
    <div id="canvas-loader">Initializing Canvas Layer...</div>
    <script>
        // Injecting the absolute raw canvas distribution packages locally
        window.addEventListener('DOMContentLoaded', () => {
            const scripts = [
                'https://jsdelivr.net',
                'https://jsdelivr.net'
            ];
            
            let loaded = 0;
            scripts.forEach(src => {
                const s = document.createElement('script');
                s.src = src;
                s.crossOrigin = 'anonymous';
                s.onload = () => {
                    loaded++;
                    if(loaded === scripts.length) {
                        document.getElementById('canvas-loader').remove();
                    }
                };
                document.body.appendChild(s);
            });
        });
    </script>
</body>
</html>
